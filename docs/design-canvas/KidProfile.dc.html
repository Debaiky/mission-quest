<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
  <style>
    :root{--bg1:#F3F7FF;--bg2:#E6EEFF;--surface:#FFFFFF;--surface2:#EEF3FF;--ink:#1F2A44;--ink2:#3F4B6B;--muted:#6B7A99;--line:#DCE4F5;--sky:#3F7BEA;--sky-deep:#2F63C9;--sky-soft:#DCE8FF;--sun:#F5A623;--sun-soft:#FFF1D6;--sun-ink:#7A4E00;--gold:#E3A008;--flame:#FF6B35;--flame-soft:#FFE4D9;--flame-ink:#9A3A12;--leaf:#2DB07A;--leaf-soft:#DDF5EA;--berry:#8B5CF6;--berry-soft:#ECE4FF;--berry-ink:#5B3BB0;--shadow:0 6px 20px rgba(31,42,68,.08)}
    body{margin:0;background:#E6EEFF;font-family:Nunito,"Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
    a{color:var(--sky)} a:hover{color:var(--sky-deep)}
    .phone{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%)}
    .content{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;padding:44px 20px 0}
    .disp{font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:800;letter-spacing:-.01em}
    .card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
    .label{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .stat{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:16px}
    .stat .v{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px;line-height:1}
    .stat .k{font-size:12px;font-weight:800}
    .tog{width:52px;height:32px;border-radius:999px;background:var(--leaf);position:relative}
    .tog::after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:999px;background:#fff}
    .col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
    .col .bar{width:20px;border-radius:6px 6px 0 0;background:var(--sky)}
    .col .d{font-size:11px;font-weight:800;color:var(--muted)}
    .col .n{font-size:12px;font-weight:800;color:var(--ink2)}
    .nav{flex:none;height:84px;padding:8px 8px 20px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;background:var(--surface);border-top:1.5px solid var(--line)}
    .nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;font-size:11px;font-weight:800;color:var(--muted);text-decoration:none;height:56px}
    .nav a.on{background:var(--sky-soft);color:var(--sky)}
    .nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
</helmet>
<div class="phone">
  <div class="content">

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="position:relative">
        <svg viewBox="0 0 64 64" width="128" height="128" aria-label="Alex's fox avatar"><circle cx="32" cy="32" r="32" fill="#DCE8FF"></circle><circle cx="32" cy="32" r="30" fill="none" stroke="#8B5CF6" stroke-width="2.5"></circle><path d="M14 26 19 9l12 11zM50 26 45 9 33 20z" fill="#E9782E"></path><circle cx="32" cy="36" r="18" fill="#F59A4A"></circle><ellipse cx="32" cy="43" rx="10" ry="7" fill="#FFF3E6"></ellipse><circle cx="25" cy="34" r="2.6" fill="#1F2A44"></circle><circle cx="39" cy="34" r="2.6" fill="#1F2A44"></circle><circle cx="32" cy="41" r="2.2" fill="#1F2A44"></circle><path d="M20 24c4-6 20-6 24 0l-3-1c-6-2-12-2-18 0z" fill="#3F7BEA"></path></svg>
        <div style="position:absolute;right:-6px;bottom:2px;height:44px;padding:0 14px;border-radius:999px;background:var(--sky);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--sky-deep)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Edit
        </div>
      </div>
      <div class="disp" style="font-size:30px;line-height:1">Alex</div>
      <div style="display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--berry-soft);color:var(--berry-ink);font-weight:800;font-size:14px">Level 7 · Climber</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <div class="stat" style="background:var(--flame-soft)">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 2c1 4.5 6 6.5 6 12a6 6 0 0 1-12 0c0-2.2 1.2-3.8 1.2-3.8S8.5 13 10 13c-.3-4 2-6.5 2-11z" fill="#FF6B35"></path><path d="M12 14c.6 1.6 2 2.4 2 4a2 2 0 0 1-4 0c0-1.2 1.2-2.2 2-4z" fill="#FFD166"></path></svg>
        <div style="display:flex;flex-direction:column;gap:2px"><div class="v" style="color:var(--flame-ink)">7</div><div class="k" style="color:var(--flame-ink)">day streak</div></div>
      </div>
      <div class="stat" style="background:var(--sun-soft)">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M3 8.5l4.5 4L12 5l4.5 7.5 4.5-4L19 19H5z" fill="#E3A008"></path><rect x="5" y="19" width="14" height="2.5" rx="1" fill="#C98A04"></rect></svg>
        <div style="display:flex;flex-direction:column;gap:2px"><div class="v" style="color:var(--sun-ink)">4</div><div class="k" style="color:var(--sun-ink)">golden streak</div></div>
      </div>
      <div class="stat" style="background:var(--surface);box-shadow:var(--shadow)">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.8 1.5 7L12 17.5 5.7 21l1.5-7L2 9.3l7-.8z" fill="#F5A623"></path></svg>
        <div style="display:flex;flex-direction:column;gap:2px"><div class="v">1,240</div><div class="k" style="color:var(--muted)">total points</div></div>
      </div>
      <div class="stat" style="background:var(--surface);box-shadow:var(--shadow)">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#8B5CF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"></circle><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"></path></svg>
        <div style="display:flex;flex-direction:column;gap:2px"><div class="v">18<span style="font-size:14px;color:var(--muted)">/42</span></div><div class="k" style="color:var(--muted)">badges</div></div>
      </div>
    </div>

    <div class="card" style="padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="label">This week</span><span style="font-size:13px;font-weight:800;color:var(--sun-ink)">325 points</span></div>
      <div style="display:flex;align-items:flex-end;gap:6px;height:96px">
        <div class="col"><div class="n">30</div><div class="bar" style="height:24px"></div><div class="d">Mon</div></div>
        <div class="col"><div class="n">45</div><div class="bar" style="height:36px"></div><div class="d">Tue</div></div>
        <div class="col"><div class="n">50</div><div class="bar" style="height:40px"></div><div class="d">Wed</div></div>
        <div class="col"><div class="n">20</div><div class="bar" style="height:16px"></div><div class="d">Thu</div></div>
        <div class="col"><div class="n">60</div><div class="bar" style="height:48px"></div><div class="d">Fri</div></div>
        <div class="col"><div class="n">80</div><div class="bar" style="height:64px"></div><div class="d">Sat</div></div>
        <div class="col"><div class="n">40</div><div class="bar" style="height:32px;background:var(--sky-soft);border:2px dashed var(--sky)"></div><div class="d" style="color:var(--ink)">Sun</div></div>
      </div>
    </div>

    <div class="card" style="padding:4px 16px;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1.5px solid var(--line)">
        <div style="display:flex;align-items:center;gap:12px;font-weight:800;font-size:16px"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#3F4B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"></path></svg>Sounds</div>
        <div class="tog"></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0">
        <div style="display:flex;align-items:center;gap:12px;font-weight:800;font-size:16px"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#3F4B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.2 2.2M16.2 16.2l2.2 2.2M5.6 18.4l2.2-2.2M16.2 7.8l2.2-2.2"></path></svg>Animations</div>
        <div class="tog"></div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:center;min-height:44px;font-size:14px;font-weight:800;color:var(--muted)">Log out</div>

  </div>

  <nav class="nav" aria-label="Main">
    <a href="#"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"></path></svg>Home</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.5"></circle></svg>Missions</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Map</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"></circle><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"></path></svg>Badges</a>
    <a href="#"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M12 8v13M5 12v9h14v-9"></path><path d="M12 8c-2-4-7-3-6-1s5 1 6 1zm0 0c2-4 7-3 6-1s-5 1-6 1z"></path></svg>Rewards</a>
    <a href="#" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>Me</a>
  </nav>
</div>
</x-dc>
</body>
</html>
