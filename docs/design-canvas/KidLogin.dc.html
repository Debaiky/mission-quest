<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
  <style>
    :root{--bg1:#F3F7FF;--bg2:#E6EEFF;--surface:#FFFFFF;--surface2:#EEF3FF;--ink:#1F2A44;--ink2:#3F4B6B;--muted:#6B7A99;--line:#DCE4F5;--sky:#3F7BEA;--sky-deep:#2F63C9;--sky-soft:#DCE8FF;--sun:#F5A623;--sun-soft:#FFF1D6;--sun-ink:#7A4E00;--leaf:#2DB07A;--shadow:0 6px 20px rgba(31,42,68,.08)}
    body{margin:0;background:#E6EEFF;font-family:Nunito,"Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
    a{color:var(--sky)} a:hover{color:var(--sky-deep)}
    .phone{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%)}
    .disp{font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:800;letter-spacing:-.01em}
    .card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
    .label{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .who{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border-radius:20px;border:2.5px solid transparent;font-weight:800;font-size:15px;color:var(--ink2)}
    .who.on{border-color:var(--sky);background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
    .key{height:60px;border-radius:16px;background:var(--surface);box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:26px;color:var(--ink)}
    .dot{width:16px;height:16px;border-radius:999px;border:2.5px solid var(--sky);background:transparent}
    .dot.full{background:var(--sky)}
  </style>
</helmet>
<div class="phone">
  <div style="display:flex;flex-direction:column;gap:22px;padding:56px 24px 0;flex:1;min-height:0">

    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div class="disp" style="font-size:30px;line-height:1.05">Who's playing?</div>
      <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted)">
        Family <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;color:var(--ink2);background:var(--surface);padding:3px 10px;border-radius:999px;letter-spacing:.04em">SUNNY-FOX-42</span>
        <a href="#" style="font-weight:800;font-size:13px;display:inline-flex;align-items:center;min-height:44px;padding:0 8px">Change</a>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      <div class="who on">
        <svg viewBox="0 0 64 64" width="84" height="84" aria-label="Fox avatar"><circle cx="32" cy="32" r="32" fill="#DCE8FF"></circle><path d="M14 26 19 9l12 11zM50 26 45 9 33 20z" fill="#E9782E"></path><circle cx="32" cy="36" r="18" fill="#F59A4A"></circle><ellipse cx="32" cy="43" rx="10" ry="7" fill="#FFF3E6"></ellipse><circle cx="25" cy="34" r="2.6" fill="#1F2A44"></circle><circle cx="39" cy="34" r="2.6" fill="#1F2A44"></circle><circle cx="32" cy="41" r="2.2" fill="#1F2A44"></circle></svg>
        Alex
      </div>
      <div class="who">
        <svg viewBox="0 0 64 64" width="84" height="84" aria-label="Bear avatar"><circle cx="32" cy="32" r="32" fill="#ECE4FF"></circle><circle cx="17" cy="20" r="8" fill="#8B5A3C"></circle><circle cx="47" cy="20" r="8" fill="#8B5A3C"></circle><circle cx="32" cy="36" r="19" fill="#A9714B"></circle><ellipse cx="32" cy="43" rx="9" ry="6.5" fill="#E9C9A8"></ellipse><circle cx="25" cy="33" r="2.6" fill="#1F2A44"></circle><circle cx="39" cy="33" r="2.6" fill="#1F2A44"></circle><ellipse cx="32" cy="41" rx="2.6" ry="2" fill="#1F2A44"></ellipse></svg>
        Maya
      </div>
      <div class="who">
        <svg viewBox="0 0 64 64" width="84" height="84" aria-label="Cat avatar"><circle cx="32" cy="32" r="32" fill="#DDF5EA"></circle><path d="M15 28 18 10l12 12zM49 28 46 10 34 22z" fill="#6B7A99"></path><circle cx="32" cy="36" r="18" fill="#8E9BB5"></circle><ellipse cx="32" cy="43" rx="9" ry="6" fill="#F2F5FF"></ellipse><circle cx="25" cy="34" r="2.6" fill="#1F2A44"></circle><circle cx="39" cy="34" r="2.6" fill="#1F2A44"></circle><path d="M30 40h4l-2 2.5z" fill="#1F2A44"></path></svg>
        Leo
      </div>
    </div>

    <div class="card" style="padding:18px 18px 16px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
        <div style="font-size:16px;font-weight:800;color:var(--ink2)">Hi Alex! Enter your PIN</div>
        <div style="display:flex;gap:14px"><span class="dot full"></span><span class="dot full"></span><span class="dot"></span><span class="dot"></span></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
        <div class="key">1</div><div class="key">2</div><div class="key">3</div>
        <div class="key">4</div><div class="key">5</div><div class="key">6</div>
        <div class="key">7</div><div class="key">8</div><div class="key">9</div>
        <div class="key" style="background:transparent;box-shadow:none;font-size:14px;font-family:Nunito,sans-serif;color:var(--muted)">Forgot?</div>
        <div class="key">0</div>
        <div class="key" style="background:transparent;box-shadow:none"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#3F4B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-6 8 6 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><path d="m18 9-6 6M12 9l6 6"></path></svg></div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:center;min-height:44px;font-size:14px;font-weight:700;color:var(--muted)">Not you? <a href="#" style="font-weight:800;display:inline-flex;align-items:center;min-height:44px;padding:0 6px">Use a username instead</a></div>
  </div>
</div>
</x-dc>
</body>
</html>
