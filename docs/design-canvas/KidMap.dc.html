<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
  <style>
    :root{--bg1:#F3F7FF;--bg2:#E6EEFF;--surface:#FFFFFF;--surface2:#EEF3FF;--ink:#1F2A44;--ink2:#3F4B6B;--muted:#6B7A99;--line:#DCE4F5;--sky:#3F7BEA;--sky-deep:#2F63C9;--sky-soft:#DCE8FF;--sun:#F5A623;--sun-soft:#FFF1D6;--sun-ink:#7A4E00;--leaf:#2DB07A;--leaf-soft:#DDF5EA;--leaf-ink:#146B47;--berry:#8B5CF6;--berry-soft:#ECE4FF;--berry-ink:#5B3BB0;--shadow:0 6px 20px rgba(31,42,68,.08)}
    body{margin:0;background:#E6EEFF;font-family:Nunito,"Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
    a{color:var(--sky)} a:hover{color:var(--sky-deep)}
    .phone{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#DDF5EA}
    .disp{font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:800;letter-spacing:-.01em}
    .card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
    .nav{flex:none;height:84px;padding:8px 8px 20px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;background:var(--surface);border-top:1.5px solid var(--line);position:relative;z-index:2}
    .nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;font-size:11px;font-weight:800;color:var(--muted);text-decoration:none;height:56px}
    .nav a.on{background:var(--sky-soft);color:var(--sky)}
    .nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .wl{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:13px;letter-spacing:.12em;fill:#3F4B6B}
    .num{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:17px;fill:#6B7A99;text-anchor:middle}
    @keyframes pulse{0%{r:30;opacity:.7}100%{r:46;opacity:0}}
    .pulse{animation:pulse 1.8s ease-out infinite}
    @media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.35}}
  </style>
</helmet>

    <g>

      <circle cx="200" cy="360" r="22" fill="#FFFFFF" stroke="#C9D2E6" stroke-width="3"></circle><text x="200" y="366" class="num">9</text>
      <circle cx="300" cy="300" r="22" fill="#FFFFFF" stroke="#C9D2E6" stroke-width="3"></circle><text x="300" y="306" class="num">10</text>
    </g>

    <rect x="0" y="0" width="390" height="260" fill="#FFFFFF" opacity=".55"></rect>
    <g>
      <circle cx="180" cy="240" r="22" fill="#F2F5FF" stroke="#D5DBEA" stroke-width="3"></circle><text x="180" y="246" class="num" fill="#A3ACC4">11</text>
      <circle cx="90" cy="180" r="22" fill="#F2F5FF" stroke="#D5DBEA" stroke-width="3"></circle><text x="90" y="186" class="num" fill="#A3ACC4">12</text>
      <circle cx="200" cy="120" r="22" fill="#F2F5FF" stroke="#D5DBEA" stroke-width="3"></circle><text x="200" y="126" class="num" fill="#A3ACC4">13</text>
    </g>
    <g transform="translate(110 68)">
      <rect x="0" y="0" width="170" height="40" rx="20" fill="#FFFFFF" stroke="#DCE4F5" stroke-width="1.5"></rect>

  <div style="position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:52px 20px 0">
    <div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;flex-direction:column;gap:1px">
          <div class="disp" style="font-size:22px;line-height:1.05">Level 7 · Climber</div>
          <div style="font-size:13px;font-weight:700;color:var(--muted)">Crystal Mountain</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--berry-soft);color:var(--berry-ink);font-weight:800;font-size:14px">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z" fill="#8B5CF6"></path></svg>
          1,220 XP
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="height:12px;border-radius:999px;background:var(--berry-soft);overflow:hidden"><div style="width:49%;height:100%;border-radius:999px;background:var(--berry)"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--muted)"><span>1,050</span><span style="color:var(--berry-ink)">180 XP to Level 8 · Summit Hero</span><span>1,400</span></div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:20px;right:20px;bottom:98px;z-index:1" class="card">
    <div style="padding:14px 16px;display:flex;align-items:center;gap:12px">
      <div style="width:48px;height:48px;border-radius:16px;background:var(--surface2);display:flex;align-items:center;justify-content:center">

</div>
