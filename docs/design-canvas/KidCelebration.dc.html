<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
  <style>
    :root{--bg1:#F3F7FF;--bg2:#E6EEFF;--surface:#FFFFFF;--surface2:#EEF3FF;--ink:#1F2A44;--ink2:#3F4B6B;--muted:#6B7A99;--line:#DCE4F5;--sky:#3F7BEA;--sky-deep:#2F63C9;--sky-soft:#DCE8FF;--sun:#F5A623;--sun-soft:#FFF1D6;--sun-ink:#7A4E00;--flame:#FF6B35;--leaf:#2DB07A;--leaf-soft:#DDF5EA;--berry:#8B5CF6;--shadow:0 6px 20px rgba(31,42,68,.08)}
    body{margin:0;background:#E6EEFF;font-family:Nunito,"Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
    a{color:var(--sky)} a:hover{color:var(--sky-deep)}
    .phone{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%)}
    .disp{font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:800;letter-spacing:-.01em}
    .card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
    .ghost{opacity:.45;filter:blur(1.5px)}
    .c{position:absolute;width:10px;height:16px;border-radius:3px}
    @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
    @keyframes rays{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    .modal{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
    .rays{animation:rays 24s linear infinite}
    @media (prefers-reduced-motion:reduce){.modal,.rays{animation:none}}
  </style>
</helmet>
<div class="phone">

  <div class="ghost" style="position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;padding:52px 20px 0">
    <div style="display:flex;align-items:center;gap:14px"><div style="width:56px;height:56px;border-radius:999px;background:#F59A4A"></div><div class="disp" style="font-size:28px">Hi, Alex! 👋</div></div>
    <div class="card" style="height:190px"></div>
    <div class="card" style="height:150px"></div>
    <div class="card" style="height:72px"></div>
    <div class="card" style="height:150px"></div>
  </div>

  <div style="position:absolute;inset:0;background:rgba(31,42,68,.55)"></div>

  <span class="c" style="left:36px;top:150px;background:#F5A623;transform:rotate(24deg)"></span>
  <span class="c" style="left:78px;top:112px;background:#3F7BEA;transform:rotate(-30deg);width:8px;height:8px;border-radius:999px"></span>
  <span class="c" style="left:120px;top:96px;background:#2DB07A;transform:rotate(60deg)"></span>
  <span class="c" style="left:190px;top:80px;background:#FF6B35;transform:rotate(12deg)"></span>
  <span class="c" style="left:250px;top:104px;background:#8B5CF6;transform:rotate(-48deg);width:8px;height:8px;border-radius:999px"></span>
  <span class="c" style="left:300px;top:130px;background:#F5A623;transform:rotate(80deg)"></span>
  <span class="c" style="left:340px;top:170px;background:#3F7BEA;transform:rotate(-15deg)"></span>
  <span class="c" style="left:52px;top:560px;background:#8B5CF6;transform:rotate(40deg)"></span>
  <span class="c" style="left:110px;top:610px;background:#2DB07A;transform:rotate(-70deg);width:8px;height:8px;border-radius:999px"></span>
  <span class="c" style="left:200px;top:640px;background:#F5A623;transform:rotate(20deg)"></span>
  <span class="c" style="left:280px;top:600px;background:#FF6B35;transform:rotate(-35deg)"></span>
  <span class="c" style="left:330px;top:540px;background:#3F7BEA;transform:rotate(65deg);width:8px;height:8px;border-radius:999px"></span>
  <span class="c" style="left:24px;top:360px;background:#2DB07A;transform:rotate(-20deg)"></span>
  <span class="c" style="left:352px;top:380px;background:#F5A623;transform:rotate(50deg)"></span>

  <div class="modal card" style="position:absolute;left:24px;right:24px;top:196px;padding:28px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;border-radius:28px;overflow:hidden">
    <svg class="rays" viewBox="0 0 400 400" width="400" height="400" style="position:absolute;left:-29px;top:-110px;opacity:.5" aria-hidden="true">
      <g fill="#FFF1D6"><path d="M200 200 180 0h40z"></path><path d="M200 200 400 180v40z"></path><path d="M200 200 220 400h-40z"></path><path d="M200 200 0 220v-40z"></path><path d="M200 200 340 60l28 28z"></path><path d="M200 200 340 340l-28 28z"></path><path d="M200 200 60 340l-28-28z"></path><path d="M200 200 60 60l28-28z"></path></g>
    </svg>
    <div style="position:relative;width:112px;height:112px;border-radius:999px;background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px #fff,0 0 0 10px var(--leaf-soft)">
      <div style="width:84px;height:84px;border-radius:999px;background:var(--leaf);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"></path></svg></div>
      <div style="position:absolute;right:-6px;top:-6px;width:40px;height:40px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow)">🎒</div>
    </div>
    <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div class="disp" style="font-size:30px;line-height:1;color:var(--leaf);letter-spacing:.01em">MISSION COMPLETE!</div>
      <div style="font-size:17px;font-weight:800;color:var(--ink2)">Pack your school bag</div>
    </div>
    <div style="position:relative;display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:var(--sun-soft)">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.8 1.5 7L12 17.5 5.7 21l1.5-7L2 9.3l7-.8z" fill="#F5A623"></path></svg>
      <div class="disp" style="font-size:36px;line-height:1;color:var(--sun-ink)">+10</div>
      <div style="font-size:14px;font-weight:800;color:var(--sun-ink);letter-spacing:.06em">POINTS</div>
    </div>
    <div style="position:relative;display:flex;flex-direction:column;gap:6px;width:100%">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--muted)"><span>Today</span><span>5 / 5</span></div>
      <div style="height:12px;border-radius:999px;background:var(--surface2);overflow:hidden"><div style="width:100%;height:100%;border-radius:999px;background:linear-gradient(90deg,#3F7BEA,#E3A008)"></div></div>
      <div style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:800;color:#8A5A00;margin-top:2px">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 8.5l4.5 4L12 5l4.5 7.5 4.5-4L19 19H5z" fill="#E3A008"></path></svg>
        That's a golden day! Streak: 5
      </div>
    </div>
    <div style="position:relative;font-size:13px;font-weight:700;color:var(--muted);margin-top:4px">Tap anywhere to continue</div>
  </div>

</div>
</x-dc>
</body>
</html>
